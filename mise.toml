[tools]
node = "22.23.4"
pnpm = "10.33.2"
lefthook = "2.2.2"

[tasks.setup]
description = "Install dependencies and wire up git hooks"
run = ["pnpm install --frozen-lockfile", "lefthook install"]

[tasks.dev]
description = "Start the Next.js dev server"
run = "pnpm dev"

[tasks.build]
description = "Static export to out/, plus out/sitemap.xml"
run = "pnpm build"

[tasks.preview]
description = "Serve out/ through wrangler, as Cloudflare does"
run = "pnpm preview"

[tasks.admin]
description = "Start the local Keystatic editor"
run = "pnpm admin"

[tasks.test]
description = "Run the content and image tests"
run = "pnpm test"

[tasks.lint]
description = "Check lint and formatting with Biome"
run = "pnpm lint"

[tasks.format]
description = "Apply Biome fixes and formatting"
run = "pnpm format"

title: About
heading: About me
draft: false
blocks:
  - discriminant: content
    value:
      body: |
        I'm a design engineer and full-stack developer in Upstate NY, and I've been building for the web since 2017. Lately I focus on frontend architecture and design systems. Outside of work I hike, cook, game, and build hobby projects like [Loupe](https://github.com/secondshift-labs/loupe).

        I build the stuff other engineers build on top of. Component libraries, developer tooling, and the conventions that keep a product consistent as a team grows.

        I'm a Staff Engineer at [Traackr](https://www.traackr.com/), leading frontend development and the design system. I grew the system from 8 shared components to 50 used across the org, and built an MCP server that exposes it to coding agents.

        I have a Bachelor of Science Degree in Information Technology and Web Science with a Concentration in Entrepreneurship from [Rensselaer Polytechnic Institute](https://rpi.edu).
      title: Hey, my name is Erik
      aside_image:
        src: /images/pages/about/blocks/0/value/aside_image/src.png
        alt: A picture of me
  - discriminant: content
    value:
      title: Experience
      body: |
        - **[Traackr](https://www.traackr.com/)**, 2022 to now. Staff Engineer, after roles as Tech Lead for the design system, Senior Software Engineer and Software Engineer.
        - **[Troy Web Consulting](https://www.troyweb.com)**, 2017 to 2022. Senior Developer, building client apps for government, healthcare and nonprofit clients.
        - **[1st Playable Productions](https://1stplayable.com)**, 2016. Seasonal Programmer, porting educational games from Flash to JavaScript.

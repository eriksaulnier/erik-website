title: About
heading: About me
draft: false
blocks:
  - discriminant: content
    value:
      body: |
        I'm a full-stack developer in Upstate NY who leans toward the design side of things. I've been building for the web since 2017. These days I mostly build the stuff other engineers build on top of.

        I'm a Staff Engineer at [Traackr](https://www.traackr.com/). Most of my time still goes to leading the engineering side of our design system. I also built an MCP server so coding agents can use it, and I've been doing some work on our platform rebuild with micro-frontends.

        Outside of work I like to hike, cook, and play games. I also tinker on side projects like [Loupe](https://github.com/secondshift-labs/loupe).

        I have a B.S. in Information Technology and Web Science from [RPI](https://rpi.edu) with a concentration in Entrepreneurship.
      title: Hey, my name is Erik
      aside_image:
        src: /images/pages/about/blocks/0/value/aside_image/src.png
        alt: A picture of me
  - discriminant: content
    value:
      title: Experience
      body: |
        - **[Traackr](https://www.traackr.com/)**, 2022 to now. Staff Engineer, after roles as Tech Lead for the design system, Senior Software Engineer and Software Engineer.
        - **[Troy Web Consulting](https://www.troyweb.com)**, 2017 to 2022. Senior Developer, building client apps for government, healthcare and nonprofit clients.
        - **[1st Playable Productions](https://1stplayable.com)**, 2016. Seasonal Programmer, porting educational games from Flash to JavaScript.

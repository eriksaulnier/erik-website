title: About
heading: About me
draft: false
blocks:
  - discriminant: content
    value:
      body: |
        I'm a software engineer based in Troy, NY who has a strong passion for all things tech. Over the last 6 years, I have had experience working on a large variety of projects of varying sizes including software applications, mobile apps, websites, and even some video games. I am always excited when presented with opportunities to add new technologies to my toolbelt and am never afraid of a challenge.

        I have a Bachelor of Science Degree in Information Technology and Web Science with a Concentration in Entrepreneurship from [Rensselaer Polytechnic Institute](https://rpi.edu).

        I currently work full-time as a Software Engineer at [Traackr](https://www.traackr.com/).

        Previously, I have worked at [Troy Web Consulting](https://www.troyweb.com) and [1st Playable Productions](https://1stplayable.com).
      title: Hey, my name is Erik
      aside_image:
        src: /images/pages/about/blocks/0/value/aside_image/src.png

title: About
heading: About me
draft: false
blocks:
  - discriminant: content
    value:
      body: |
        I'm a full-stack engineer in Upstate NY, and I've been building for the web since 2017. Lately I focus on frontend architecture and design systems. Outside of work I game and cook.

        I build the stuff other engineers build on top of. Component libraries, developer tooling, and the conventions that keep a product consistent as a team grows.

        I'm a Staff Engineer at [Traackr](https://www.traackr.com/), leading frontend development and the design system. I grew the system from 8 shared components to 50 used across the org, and built an MCP server that exposes it to coding agents.

        I have a Bachelor of Science Degree in Information Technology and Web Science with a Concentration in Entrepreneurship from [Rensselaer Polytechnic Institute](https://rpi.edu). Before Traackr I worked at [Troy Web Consulting](https://www.troyweb.com) and [1st Playable Productions](https://1stplayable.com).
      title: Hey, my name is Erik
